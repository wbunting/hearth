[package]
include = ["/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-icon"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
iconify = [
	"dep:serde",
]
# Exposes the staging API (`BuildConfig`) for use from a build script.
iconify-build = [
	"iconify",
	"hearth-foundation/build",
	"dep:serde_json",
	"dep:thiserror",
	"dep:ureq",
]

[dependencies]
hearth-foundation.workspace = true
hearth-view.workspace = true
hearth-view-macro.workspace = true

serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
hearth = { path = "../hearth", features = ["icon-iconify"] }
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["hearth"]
