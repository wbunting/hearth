[package]
include = ["/fonts.json", "/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-font"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
asset = [
	"dep:hearth-asset",
]
discover = [
	"dep:inventory",
]
fontsource = []
# Enables the `refresh` binary, which fetches data from the Fontsource API.
fontsource-refresh = [
	"fontsource",
	"dep:serde",
	"dep:serde_json",
	"dep:ureq",
]
router = [
	"dep:hearth-router",
]
view = [
	"dep:hearth-view",
	"dep:hearth-view-macro",
	"hearth-asset?/view",
]

[dependencies]
hearth-foundation.workspace = true
hearth-asset = { workspace = true, optional = true }
hearth-router = { workspace = true, optional = true }
hearth-view = { workspace = true, optional = true }
hearth-view-macro = { workspace = true, optional = true }

inventory = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[build-dependencies]
heck.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[bin]]
name = "refresh"
required-features = ["fontsource-refresh"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
hearth = { path = "../hearth", features = ["view", "asset", "font-fontsource"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["hearth"]
