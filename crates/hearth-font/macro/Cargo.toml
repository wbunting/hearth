[package]
include = ["/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-font-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
fontsource = [
	"hearth-font-grammar/fontsource",
]
asset = [
	"hearth-font-grammar/asset",
]

[dependencies]
hearth-font-grammar.workspace = true

quote.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
hearth = { path = "../../hearth", features = ["font-fontsource", "asset"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
