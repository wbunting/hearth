[package]
include = ["/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-runtime-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
discover = [
	"hearth-runtime-grammar/discover"
]

[dependencies]
hearth-runtime-grammar.workspace = true

quote.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
hearth = { path = "../../hearth", features = ["asset", "router", "runtime", "view", "websocket"] }

futures-util.workspace = true
http.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
