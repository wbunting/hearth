[package]
include = ["/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
router = [
	"dep:futures-util",
	"dep:pin-project-lite",
	"dep:tokio",
	"dep:hearth-router",
]

[dependencies]
hearth-asset.workspace = true
hearth-foundation.workspace = true
hearth-router = { workspace = true, optional = true }
hearth-view.workspace = true
hearth-view-macro.workspace = true

pin-project-lite = { workspace = true, optional = true }
ref-cast.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
inventory.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hearth-router = { workspace = true, optional = true, features = ["websocket"] }

futures-util = { workspace = true, optional = true, features = ["sink"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }

[dev-dependencies]
# We cannot use `workspace = true` with `default-features = false`.
hearth = { path = "../hearth", default-features = false, features = ["asset", "router", "runtime", "view"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
