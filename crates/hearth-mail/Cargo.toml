[package]
include = ["/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-mail"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
router = [
	"dep:hearth-router",
]
smtp = ["lettre/smtp-transport", "lettre/tokio1", "lettre/tokio1-rustls-tls", "lettre/pool"]

[dependencies]
hearth-foundation.workspace = true
hearth-router = { workspace = true, optional = true }
hearth-view.workspace = true

lettre = { workspace = true, features = ["builder", "hostname"] }
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
