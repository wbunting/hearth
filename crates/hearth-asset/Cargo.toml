[package]
include = ["/src/**", "/docs/**", "/README.md", "/Cargo.toml", "/LICENSE", "/NOTICE", "/build.rs", "/browser/src/**", "/browser/dist/*.js", "/browser/package.json", "/browser/tsconfig.json", "/browser/tsup*.ts", "/components/**", "/styles/**", "/registry.toml", "/themes/**"]
name = "hearth-asset"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []

bundler = [
	"hearth-foundation/build",
	"dep:mime_guess",
	"dep:ureq",
]
router = [
	"view",
	"dep:hearth-router",
]
serve = [
	"router",
	"dep:tokio",
]
view = [
	"dep:hearth-view",
]

[dependencies]
hearth-foundation.workspace = true
hearth-router = { workspace = true, optional = true }
hearth-view = { workspace = true, optional = true }

http.workspace = true
memchr.workspace = true
mime_guess = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["fs", "rt"] }
toml.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
hearth = { path = "../hearth", features = ["asset"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["hearth"]
