[package]
name = "ui"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
hearth = { workspace = true, features = ["font-fontsource", "icon-iconify", "tailwind", "ui"] }

[build-dependencies]
# We cannot use `workspace = true` with `default-features = false`.
hearth = { path = "../../crates/hearth/", default-features = false, features = ["icon-iconify", "tailwind"] }

[dev-dependencies]
hearth-ui.workspace = true

[lints]
workspace = true
