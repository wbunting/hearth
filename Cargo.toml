[workspace]
resolver = "3"
members = ["apps/zbugs"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.0.0"
publish = false

[workspace.dependencies]
topcoat = "=0.10.0"
toasty = { version = "=0.11.0", features = ["sqlite", "migration"] }
toasty-cli = "=0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rand = "0.9"
