name: CI

# hearth's CI. Upstream Topcoat's workflow (release-plz, all-workspace
# matrices, yarn) doesn't apply to this fork; these jobs cover what hearth
# changes: the hearth crates, the forked view grammar, the browser runtime,
# and the example app.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from rust-toolchain.toml (pinned 1.99.1).
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p hearth -p hearth-macro -p topcoat-view-grammar -p topcoat-runtime -p topcoat-router -p topcoat-tailwind
      - run: cargo test --locked -p hearth-tracker
      - run: cargo test --locked -p topcoat-font -p topcoat-font-grammar -p topcoat-font-macro
      - run: cargo clippy --locked -p topcoat-font -p topcoat-font-grammar -p topcoat-font-macro --all-targets -- -D warnings
      - run: cargo build --locked --release -p hearth-tracker
      - run: cargo clippy --locked -p hearth -p hearth-macro -p hearth-tracker -p topcoat-router -p topcoat-tailwind -- -D warnings

  runtime:
    name: runtime (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: crates/topcoat-runtime/browser
        run: npx tsc --noEmit
      - working-directory: crates/topcoat-runtime/browser
        run: npx vitest run
      # The runtime bundle is committed and embedded by the Rust crate:
      # reject stale artifacts.
      - working-directory: crates/topcoat-runtime/browser
        run: pnpm build && git diff --exit-code -- dist/index.js dist/coherence.js dist/persist.js
