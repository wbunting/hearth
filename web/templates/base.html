<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  {% block canonical %}<link rel="canonical" href="{% if page %}{{ page.permalink }}{% else %}{{ config.base_url }}/{% endif %}">{% endblock canonical %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ config.title }}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:image" content="{{ config.base_url }}/assets/social.png">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/manrope.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/assets/site.css?v={{ config.extra.asset_revision }}">
  <link rel="stylesheet" href="/assets/docs.css?v={{ config.extra.asset_revision }}">
  <link rel="stylesheet" href="/giallo.css?v={{ config.extra.asset_revision }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header wrap">
  <a href="/" aria-label="Hearth home"><img src="/assets/logo.svg" alt="hearth" width="142" height="48"></a>
  <nav aria-label="Main navigation">
    <a href="/docs/getting-started/">Get started</a>
    <a href="/docs/">Docs</a>
    <a href="{{ config.extra.demo_url }}">Live demo <span aria-hidden="true">↗</span></a>
    <a href="{{ config.extra.repository_url }}">GitHub</a>
  </nav>
</header>
{% block main %}{% endblock main %}
<footer class="wrap">
  <a href="/" aria-label="Hearth home"><img src="/assets/logo.svg" alt="hearth" width="118" height="40"></a>
  <p>MIT licensed.</p>
  <nav aria-label="Footer">
    <a href="/docs/">Docs</a>
    <a href="https://crates.io/crates/hearth">crates.io</a>
    <a href="{{ config.extra.repository_url }}">GitHub</a>
  </nav>
</footer>
</body>
</html>
