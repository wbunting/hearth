base_url = "https://usehearth.dev"
title = "Hearth - Local-first web apps, authored in Rust"
description = "A Rust web framework with server-rendered HTML, generated JavaScript interactions and Rust-declared local-first data."
compile_sass = false
build_search_index = false
minify_html = true

[markdown]
external_links_target_blank = false

# Build-time highlighting with Zola's TextMate grammars (the same grammars
# VS Code and Shiki use). Class output keeps the no-script, self-only CSP.
[markdown.highlighting]
theme = "hearth"
extra_themes = ["hearth-syntax.json"]
style = "class"

[extra]
demo_url = "https://demo.usehearth.dev"
repository_url = "https://github.com/wbunting/hearth"
